# Rate limit rules. Reloaded on SIGHUP without dropping requests (Week 5).
# Rules are templates; per-customer numbers come from the plan hash {cust:N}:plan when a rule says
# limit_from (docs/CUSTOMER_PLANS.md). Keys: cust:42 style ids, e.g. Check{key: "cust:42", rule: "daily_quota"}.
rules:
  daily_quota:            # a customer's daily quota (Free 200, Pay 2,000), resets 00:00 UTC
    algorithm: quota
    limit_from: plan.daily
    strict: true          # exact: one Redis call per check (quota rules must be strict)
    quota_mode: auto      # with the leased engine, plans of 100,000+ a day lease 0.1% chunks through
                          # the customer rule (up to N x 0.1% over a day); strict | auto
    failure_policy: fail_closed

  burst:                  # a customer's burst limit: plan.burst tokens, refilled plan.refill per second
    algorithm: token_bucket
    limit_from: plan.burst
    strict: true          # per-customer leases arrive with the plan cache (Week 4)
    failure_policy: fail_closed

  customer:               # one API call of a customer (Week 4): suspended? deny cache? burst, then the
    burst: burst          # daily quota under the plan's overage policy (hard, grace or cap); the burst
    quota: daily_quota    # token goes back when the quota denies. Gateways send this one rule.

  api_default:
    algorithm: token_bucket
    limit: 1000           # burst capacity (tokens)
    refill_per_sec: 500   # sustained rate
    strict: false         # false = serve from local lease; true = exact Redis check per request
    failure_policy: fail_open

  login_attempts:
    algorithm: sliding_window
    limit: 5
    window_ms: 60000
    strict: true          # low volume, high accuracy: bypass leasing
    failure_policy: fail_closed

  demo:                   # small bucket so a few curls through the demo gateway hit 429
    algorithm: token_bucket
    limit: 5              # 5 requests back to back
    refill_per_sec: 1     # then 1 more per second
    strict: true          # exact per-request answers for the demo and the algorithm comparison
    failure_policy: fail_closed

  # Same budget as `demo` (5 per 5 s) under the two window algorithms, for side-by-side comparison.
  demo_fixed_window:
    algorithm: fixed_window   # cheapest; up to 2x limit across a window edge
    limit: 5
    window_ms: 5000
    strict: true
    failure_policy: fail_closed

  demo_sliding_window:
    algorithm: sliding_window # sliding window counter: smooths the window edge, O(1) state
    limit: 5
    window_ms: 5000
    strict: true
    failure_policy: fail_closed
