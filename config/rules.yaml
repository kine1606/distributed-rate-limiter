# Rate limit rules. Reloaded on SIGHUP without dropping requests (Week 4).
rules:
  api_default:
    algorithm: token_bucket
    limit: 1000           # burst capacity (tokens)
    refill_per_sec: 500   # sustained rate
    strict: false         # false = serve from local lease; true = exact Redis check per request
    failure_policy: fail_open

  login_attempts:
    algorithm: sliding_window
    limit: 5
    window_ms: 60000
    strict: true          # low volume, high accuracy: bypass leasing
    failure_policy: fail_closed

  demo:                   # small bucket so a few curls through the demo gateway hit 429
    algorithm: token_bucket
    limit: 5              # 5 requests back to back
    refill_per_sec: 1     # then 1 more per second
    strict: true          # exact per-request answers for the demo and the algorithm comparison
    failure_policy: fail_closed

  # Same budget as `demo` (5 per 5 s) under the two window algorithms, for side-by-side comparison.
  demo_fixed_window:
    algorithm: fixed_window   # cheapest; up to 2x limit across a window edge
    limit: 5
    window_ms: 5000
    strict: true
    failure_policy: fail_closed

  demo_sliding_window:
    algorithm: sliding_window # sliding window counter: smooths the window edge, O(1) state
    limit: 5
    window_ms: 5000
    strict: true
    failure_policy: fail_closed
